<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home | FWI Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f2a24 0%, #3c2a1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 40px 15px;
        }

        .welcome-card {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            padding: 50px 40px;
            max-width: 480px;
        }

        .welcome-card h1 {
            font-weight: 700;
            color: #d9480f;
            margin-bottom: 10px;
        }

        .welcome-card p {
            color: #6c757d;
            margin-bottom: 25px;
        }

        .btn-go {
            background-color: #d9480f;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px 30px;
            border-radius: 8px;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-go:hover {
            background-color: #b8380a;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <h1>Welcome to the Home Page</h1>
        <p>Predict the Forest Fire Weather Index using our machine learning model.</p>
        <a href="{{ url_for('predict_datapoint') }}" class="btn btn-go">Go to Prediction</a>
    </div>

</body>
</html>
