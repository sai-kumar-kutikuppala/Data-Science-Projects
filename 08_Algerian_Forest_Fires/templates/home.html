<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FWI Prediction</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1f2a24 0%, #3c2a1e 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Arial, sans-serif;
            padding: 40px 15px;
        }

        .login {
            background: #ffffff;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
            padding: 40px 35px;
            width: 100%;
            max-width: 480px;
        }

        .login h1 {
            text-align: center;
            font-weight: 700;
            color: #d9480f;
            margin-bottom: 6px;
        }

        .login .subtitle {
            text-align: center;
            color: #6c757d;
            margin-bottom: 25px;
            font-size: 0.9rem;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
            margin-bottom: 3px;
        }

        .btn-predict {
            background-color: #d9480f;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            width: 100%;
            margin-top: 10px;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-predict:hover {
            background-color: #b8380a;
            color: #fff;
        }

        .result-box {
            margin-top: 25px;
            padding: 15px;
            background-color: #fff4e6;
            border-left: 5px solid #d9480f;
            border-radius: 8px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            color: #843a08;
        }
    </style>
</head>
<body>

    <div class="login">
        <h1>FWI Prediction</h1>
        <p class="subtitle">Forest Fire Weather Index Estimator</p>

        <!-- Main Input For Receiving Query to our ML -->
        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="mb-3">
                <label class="form-label">Temperature</label>
                <input type="text" class="form-control" name="Temperature" placeholder="e.g. 29" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">Relative Humidity (RH)</label>
                <input type="text" class="form-control" name="RH" placeholder="e.g. 57" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">Wind Speed (Ws)</label>
                <input type="text" class="form-control" name="Ws" placeholder="e.g. 18" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">Rain</label>
                <input type="text" class="form-control" name="Rain" placeholder="e.g. 0.0" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">FFMC</label>
                <input type="text" class="form-control" name="FFMC" placeholder="e.g. 65.7" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">DMC</label>
                <input type="text" class="form-control" name="DMC" placeholder="e.g. 3.4" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">ISI</label>
                <input type="text" class="form-control" name="ISI" placeholder="e.g. 1.3" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">Classes</label>
                <input type="text" class="form-control" name="Classes" placeholder="e.g. 0 or 1" required="required">
            </div>

            <div class="mb-3">
                <label class="form-label">Region</label>
                <input type="text" class="form-control" name="Region" placeholder="e.g. 0 or 1" required="required">
            </div>

            <button type="submit" class="btn btn-predict">Predict</button>
        </form>

        <div class="result-box">
            The FWI prediction is {{ results }}
        </div>
    </div>

</body>
</html>
